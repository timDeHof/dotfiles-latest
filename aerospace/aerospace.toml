# AeroSpace Configuration
# Optimized for performance and productivity

after-login-command = []

# Only borders in after-startup (sketchybar handled by launchctl)
after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE EMPTY_WORKSPACES=$AEROSPACE_EMPTY_WORKSPACES',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout settings
accordion-padding = 30
default-root-container-layout = 'tiles' # tiles|accordion
default-root-container-orientation = 'auto'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = "move-mouse window-lazy-center"

# Disable accidental Cmd+H
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'
# Gaps
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 40
outer.right = 10

# Workspace to monitor assignments
[workspace-to-monitor-force-assignment]
E = 'Built-in Retina Display'
I = 'Built-in Retina Display'
N = 'Built-in Retina Display'
S = 'Acer S231HL'
T = 'Built-in Retina Display'
W = 'MSI MAG321CQR'

# Main binding mode
[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus navigation (vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Reset/flatten layout
alt-r = 'flatten-workspace-tree'

# Workspace switching (with window)
alt-e = 'workspace E'
alt-i = 'workspace I'
alt-n = 'workspace N'
alt-t = 'workspace T'
alt-s = 'workspace S'
alt-w = 'workspace W'
alt-a = 'workspace prev'
alt-d = 'workspace next'

# Move node to workspace
alt-shift-e = ['move-node-to-workspace E', 'workspace E']
alt-shift-i = ['move-node-to-workspace I', 'workspace I']
alt-shift-n = ['move-node-to-workspace N', 'workspace N']
alt-shift-s = ['move-node-to-workspace S', 'workspace S']
alt-shift-t = ['move-node-to-workspace T', 'workspace T']
alt-shift-w = ['move-node-to-workspace W', 'workspace W']
alt-shift-a = ['move-node-to-workspace prev', 'workspace prev']
alt-shift-d = ['move-node-to-workspace next', 'workspace next']

# Workspace back and forth
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Productivity Bindings ---

# # Close window
# alt-q = 'close'

# # Toggle floating layout
# alt-f = ['layout floating tiling', 'mode main']

# # Layout presets
# f6 = 'layout tiling'
# f5 = 'layout accordion'

# # Scratchpad (floating terminal)
# ctrl-alt-shift-z = 'exec-and-forget /Users/timothydehof/.config/aerospace/scripts/scratchpad.sh'

# Service mode toggle
ctrl-alt-shift-cmd-semicolon = 'mode service'

# Join with neighbor (service mode)
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['flatten-workspace-tree', 'mode main'] # sticky is not yet supported
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Volume controls
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# Auto-assign apps to workspaces
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace I'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace N'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-id = 'Cisco-Systems.Spark'
run = 'move-node-to-workspace W'
