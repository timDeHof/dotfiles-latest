"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000

# Single line format
format = "$directory$git_branch$git_status$nodejs$rust$golang$python$character"

[directory]
style = "fg:#1e1e2e bg:#89b4fa"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Developer" = ""

[git_branch]
symbol = ""
style = "fg:#1e1e2e bg:#a6adc8"
format = "[[ $symbol $branch ]($style)]($style)"

[git_status]
style = "fg:#1e1e2e bg:#a6adc8"
format = "[( $all_status$ahead_behind )]($style)"
ahead = "[⇡$count ](bold cyan)"
behind = "[⇣$count ](bold cyan)"
diverged = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged = "[+$count ](bold green)"
modified = "[●$count ](bold yellow)"
untracked = "[?$count ](bold white)"
deleted = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[nodejs]
symbol = ""
style = "fg:#1e1e2e bg:#94e2d5"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:#1e1e2e bg:#f5c2e7"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:#1e1e2e bg:#89dceb"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:#1e1e2e bg:#f9e2af"
format = "[ $symbol $version ]($style)"
detect_files = []
detect_extensions = []
detect_folders = [".venv", "venv", "virtualenv", ".direnv"]

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"

# Disabled modules (handled by tmux)
[time]
disabled = true

[custom.weather]
disabled = true

[aws]
disabled = true

[docker_context]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true
