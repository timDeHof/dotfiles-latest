# Catppuccin Mocha Kitty Config
# ─────────────────────────────────

# Theme. Absolute path because only kitty.conf is symlinked into
# ~/.config/kitty, and kitty resolves relative includes from there.
# Settings below override the theme.
include ~/github/dotfiles-latest/kitty/themes/themes/Catppuccin-Mocha.conf

# Fonts
font_family      JetBrainsMono Nerd Font Mono
# bold pinned to ExtraBold — `auto` picks SemiBold, which reads too light
bold_font        family="JetBrainsMono Nerd Font Mono" style="ExtraBold"
italic_font      auto
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="ExtraBold Italic"
font_size        15.0

# Window Padding (finally!)
window_padding_width 8 12 8 12

# Cursor
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 5000

# URL Detection
url_color #89b4fa
url_style curly

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Mouse
copy_on_select clipboard
mouse_hide_wait 3.0

# Window
inactive_text_alpha 0.7

# Cursor Trail
cursor_trail 30
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Cursor Beam
cursor_shape beam

## The thickness of the beam cursor (in pts).
cursor_beam_thickness 1.5

## The thickness of the underline cursor (in pts).
cursor_underline_thickness 2.0

#: The interval to blink the cursor (in seconds). Set to zero to
#: disable blinking. Negative values mean use system default. Note
#: that the minimum interval will be limited to repaint_delay.
cursor_blink_interval 0

#: Stop blinking cursor after the specified number of seconds of
#: keyboard inactivity. Set to zero to never stop blinking.
cursor_stop_blinking_after 0

#: Background opacity
background_opacity 0.83
dynamic_background_opacity yes

background_blur 0


# Scrollbar
scrollbar_handle_color #6c7086
scrollbar_track_color #1e1e2e
scrollbar_handle_opacity 0.6
scrollbar_radius 0.3
scrollbar_gap 0.1

# Tab Bar Style
tab_bar_style powerline
tab_powerline_style slanted

# macOS
macos_titlebar_color background
macos_option_as_alt yes

# The default is ctrl+shift
#kitty_mod ctrl+cmd


# ═══════════════════════════════════
# Salvaged from previous config
# ═══════════════════════════════════

#: You can also create shortcuts to switch to specific layouts::
map ctrl+cmd+option+u goto_layout tall
map ctrl+cmd+option+i goto_layout fat
map ctrl+cmd+option+o goto_layout stack


# Open config in nvim with fn+ctrl+shift+f2
editor nvim

# Reload kitty.conf
map ctrl+cmd+, load_config_file

# ===================================
# Sessions. Absolute paths because kitty resolves relative session paths
# from ~/.config/kitty, where only kitty.conf is symlinked.
# kitty_mod+s replaces the default paste_from_selection binding.
# ===================================
map kitty_mod+s goto_session ~/github/dotfiles-latest/kitty/sessions
map kitty_mod+d goto_session ~/github/dotfiles-latest/kitty/sessions/dotfiles.kitty-session
# Prompts for a file name and saves it relative to the sessions directory.
map kitty_mod+alt+s save_as_session --save-only --base-dir=~/github/dotfiles-latest/kitty/sessions

# Never prompt when closing a window/tab
confirm_os_window_close 0

# Remote control, e.g. `kitten @ --to $KITTY_LISTEN_ON ls`.
#
# socket-only is deliberately narrower than `yes`: it accepts control over the
# socket but DENIES it over the TTY. Per kitty's docs, the TTY channel "even
# works over SSH connections", meaning any program running in the terminal
# could drive kitty — including reading window contents.
#
# The socket lives in $TMPDIR (mode 700, per-user) rather than /tmp, which is
# world-readable. kitty appends "-<pid>", so instances get distinct sockets.
#
# NOTE: listen_on is NOT applied by a config reload (ctrl+shift+f5 / SIGUSR1).
# It needs a full kitty restart.
allow_remote_control socket-only
listen_on unix:${TMPDIR}/kitty

# Borderless look from the old config. Uncomment if you want the
# titlebar gone; "titlebar-only" keeps the rounded corners.
# hide_window_decorations titlebar-only
