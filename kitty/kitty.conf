# Catppuccin Macchiato Kitty Config
# ─────────────────────────────────

# Fonts
font_family      JetBrainsMono Nerd Font Mono
# bold pinned to ExtraBold — `auto` picks SemiBold, which reads too light
bold_font        family="JetBrainsMono Nerd Font Mono" style="ExtraBold"
italic_font      auto
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="ExtraBold Italic"
font_size        16.0

# Window Padding (finally!)
window_padding_width 8 12 8 12

# Cursor
cursor_shape          block
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 5000

# URL Detection
url_color #89b4fa
url_style curly

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Mouse
copy_on_select clipboard
mouse_hide_wait 3.0
focus_follows_mouse no

# Window
remember_window_size yes
draw_minimal_borders yes
window_margin_width 0
active_border_color   #c6a0f6
inactive_border_color #45475a
inactive_text_alpha 0.7

# Cursor Trail
cursor_trail 30
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Scrollbar
scrollbar_width 0.5
scrollbar_handle_color #6c7086
scrollbar_track_color #1e1e2e
scrollbar_handle_opacity 0.6
scrollbar_radius 0.3
scrollbar_gap 0.1

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Shell Integration
shell_integration enabled

# ═══════════════════════════════════
# Catppuccin Macchiato Theme
# ═══════════════════════════════════

# Background & Foreground
background            #1e1e2e
foreground            #cdd6f4

# Cursor
cursor                #f5e0dc
cursor_text_color     #1e1e2e

# Selection
selection_background   #45475a
selection_foreground   #f5e0dc

# Tab Bar
active_tab_background   #313244
active_tab_foreground   #cdd6f4
inactive_tab_background #181825
inactive_tab_foreground #6c7086
tab_bar_background #11111b

# Marks
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# Tab Bar Style
tab_bar_style powerline
tab_powerline_style slanted

# Wayland
wayland_titlebar_color background
macos_titlebar_color background

# macOS
macos_option_as_alt yes

