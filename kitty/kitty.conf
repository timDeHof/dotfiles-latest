# ═══════════════════════════════════
# Salvaged from previous config
# ═══════════════════════════════════

# Open config in nvim with fn+ctrl+shift+f2
editor nvim

# Never prompt when closing a window/tab
confirm_os_window_close 0

# Needed by scripts that drive kitty via `kitty @ ...`
allow_remote_control yes

# Borderless look from the old config. Uncomment if you want the
# titlebar gone; "titlebar-only" keeps the rounded corners.
# hide_window_decorations titlebar-only

# Themes from ./themes are still available, e.g.:
# include ~/github/dotfiles-latest/kitty/active-theme.conf
