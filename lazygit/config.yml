# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
gui:
  mouseEvents: false
git:
  autoFetch: false
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --syntax-theme="Solarized (dark)"
customCommands:
  - key: C
    context: files
    command: git cz
    output: terminal
    description: Commit with commitizen
